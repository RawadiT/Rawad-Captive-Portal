<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>روتانا - شركة رواد التقنيات | حالة الاتصال</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script>
    (function () {
      var portalBase = "https://wifi.YOUR_COMPANY_DOMAIN.com";
      window.location.replace(portalBase + "/?mac=" + encodeURIComponent("$(mac)") + "&ip=" + encodeURIComponent("$(ip)"));
    })();
  </script>
</head>
<body>
  <main class="card">
    <img src="assets/logo.png" alt="شعار شركة رواد التقنيات" class="logo" />
    <h1>روتانا - شركة رواد التقنيات</h1>
    <p>تم الاتصال بالشبكة بنجاح. يمكنك متابعة الوقت المتبقي من خلال البوابة.</p>
    <a class="btn" href="https://wifi.YOUR_COMPANY_DOMAIN.com/?mac=$(mac-esc)&ip=$(ip)">عرض حالة الجلسة</a>
  </main>
</body>
</html>
