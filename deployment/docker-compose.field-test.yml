# Reproducible Local PostgreSQL + PostgREST Environment for Field-Test Integration
# Bound strictly to 127.0.0.1 (loopback only). NEVER use in production.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fieldtest_pg_pass
      POSTGRES_DB: rawad_test
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - ./field-test-init.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
      - ../supabase/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rawad_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:fieldtest_pg_pass@postgres:5432/rawad_test
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: field-test-only-postgrest-jwt-secret-32chars-min

  supabase-local-gateway:
    image: nginx:alpine
    depends_on:
      - postgrest
    ports:
      - "127.0.0.1:54321:3000"
    volumes:
      - ./nginx/field-test-postgrest.conf:/etc/nginx/conf.d/default.conf:ro
