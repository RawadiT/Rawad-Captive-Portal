services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: rawad-portal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - TRUST_PROXY=true
    ports:
      # Strictly localhost-only binding for local health checks; never exposed publicly
      - "127.0.0.1:4000:4000"
    volumes:
      - ./tls/certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: rawad-portal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    container_name: rawad-tls-proxy
    restart: unless-stopped
    ports:
      # Guest Portal HTTPS (MUST be bound to explicit server IP, never 0.0.0.0)
      - "${GUEST_PROXY_BIND_IP:?ERROR_SET_GUEST_PROXY_BIND_IP_IN_ENV}:443:443"
      # Admin Interface HTTPS (Strictly bound to localhost or Staff IP only!)
      - "${STAFF_BIND_IP:-127.0.0.1}:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
