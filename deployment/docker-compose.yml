services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: rawad-portal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PROJECT_ROOT=/app
      - DATABASE_PATH=/app/data/rawad_portal.db
      - SCHEMA_DIR=/app/database/schema
      - HOST=0.0.0.0
      - TRUST_PROXY=true
    volumes:
      - portal_data:/app/data
      - ./tls/certs:/app/certs:ro
    # Backend port is NOT published to host/guest interfaces; accessed only via Nginx

  guest-portal:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.guest
    container_name: rawad-guest-portal
    restart: unless-stopped
    depends_on:
      - backend

  admin-dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.admin
    container_name: rawad-admin-dashboard
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: rawad-tls-proxy
    restart: unless-stopped
    ports:
      # Guest Portal HTTPS (Staff/Mgmt IP reachable from Guest Walled Garden)
      - "${GUEST_PROXY_BIND_IP:-0.0.0.0}:443:443"
      # Admin Dashboard HTTPS (Strictly bound to localhost or Staff LAN IP only!)
      - "${STAFF_BIND_IP:-127.0.0.1}:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - guest-portal
      - admin-dashboard

volumes:
  portal_data:
