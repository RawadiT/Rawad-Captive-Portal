worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # 1. Guest-Facing HTTPS Portal (Port 443) — Uses publicly-trusted fullchain.pem (Let's Encrypt DNS-01)
  # Note: Let's Encrypt retired OCSP in 2025 and uses CRLs (http://*.c.lencr.org/*.crl).
  # Therefore ssl_stapling is intentionally NOT enabled.
  # Strictly NO Admin access allowed on this listener.
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Explicitly block Admin API from Guest-facing listener
    location /api/admin/ {
      return 403;
    }

    location /api/guest/ {
      proxy_pass http://backend:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      proxy_pass http://guest-portal:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # 2. Staff/Admin-Only HTTPS Listener (Port 8443 — bound ONLY to Staff/Localhost IP)
  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/admin/ {
      proxy_pass http://backend:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://admin-dashboard:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
