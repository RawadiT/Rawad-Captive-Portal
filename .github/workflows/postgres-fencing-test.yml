name: PostgreSQL Fencing Concurrency Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fencing-concurrency-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: rawad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rawad_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure PostgreSQL client (psql) is installed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Run Real 2-Connection PostgreSQL Fencing Test (8/8)
        env:
          TEST_DATABASE_URL: postgres://postgres:test_password@127.0.0.1:5432/rawad_test
          REQUIRE_TEST_DB: 'true'
        run: |
          set -o pipefail
          node tests/verify_fencing_race.mjs | tee test_output.log
          grep -q "ALL REAL 2-CONNECTION POSTGRESQL FENCING TESTS PASSED (8/8)" test_output.log
